[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-annotator"
version = "0.1.0"
description = "Frame-accurate behavioral annotation tool for rodent social-behavior videos"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.20",
    "pandas>=1.3",
    "Pillow>=9.0",
]

[project.scripts]
annotate = "annotator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["annotator*"]
